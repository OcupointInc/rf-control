// control.proto — SYNCED copy of the RF-instrument firmware control protocol.
//
// The CANONICAL definition lives in the firmware repo
// (github.com/OcupointInc/wiznet-ethernet-firmware, examples/dhcp_dns/control.proto).
// This copy exists so the rf-control Go library can generate its own bindings;
// keep it byte-for-byte identical to the canonical file EXCEPT the go_package
// line below. After syncing, regenerate the Go bindings:
//
//   protoc -I. --go_out=. --go_opt=module=github.com/OcupointInc/rf-control control.proto
//
// Do not hand-edit controlpb/control.pb.go.
//
// DIVERGENCE (pending firmware sync): SetClockSource (Packet tags 30/31) and
// GetStatusResponse.clock_source_external are defined here ahead of the
// canonical firmware proto — the STRAPS internal/external reference-clock select
// (SI53301 CLK_SEL, on GP27 via a board mod). The firmware does not handle it
// yet, so a device replies ERROR_CODE_UNSUPPORTED until the handler lands; when
// it does, mirror these additions into the canonical proto with the SAME tags.
//
// TAG GAP: the Packet oneof jumps from 37 to 52. Tags 38-51 belong to canonical
// firmware messages this copy has not been synced with yet (40-47 are reserved
// for OTA); the ADF4159 extended-control block at 52-61 was added here from the
// shared wire spec without back-filling them. Never reuse 38-51 for something
// else — the tag numbers, not their contiguity, are what has to match.
//
// POLARITY: both fields carry `external` sense — true = external reference,
// false = internal on-board oscillator. This is the OPPOSITE of the adjacent
// cal_source_internal / SetCalSourceRequest.internal fields, and it was chosen
// on the host side before any firmware handler existed to validate it against.
// When implementing the handler, mirror this sense exactly, or drive CLK_SEL to
// match it — a mismatch decodes cleanly (bool on field 1 either way) and shows
// up only as the LO locking to the wrong reference.
syntax = "proto3";

package control;

option go_package = "github.com/OcupointInc/rf-control/controlpb;controlpb";

// Enums for each switch bank
enum RfSwitchOption {
  RF_SWITCH_OPTION_4GHZ_LPF = 0;
  RF_SWITCH_OPTION_2GHZ_LPF = 1;
}

enum MixerSwitchOption {
  MIXER_SWITCH_OPTION_MIXER = 0;
  MIXER_SWITCH_OPTION_BYPASS = 1;
}

enum IfSwitchOption {
  IF_SWITCH_OPTION_900MHZ_LPF = 0;
  IF_SWITCH_OPTION_1_2GHZ_BANDPASS = 1;
}

// Enum for RF bands
enum RfBand {
  RF_BAND_10_900MHZ = 0;
  RF_BAND_900_1800MHZ = 1;
  RF_BAND_1800_2700MHZ = 2;
  RF_BAND_2700_3600MHZ = 3;
  RF_BAND_3600_4500MHZ = 4;
}

// FMCW chirp/ramp shape for the ADF4159 (Barracuda). CONTINUOUS variants free-run
// once armed; TRIGGERED variants emit one ramp per TXDATA trigger pulse.
enum ChirpMode {
  CHIRP_MODE_SAWTOOTH_CONTINUOUS = 0;  // reset-to-start sawtooth, free-running
  CHIRP_MODE_TRIANGLE_CONTINUOUS = 1;  // up/down triangle, free-running
  CHIRP_MODE_SAWTOOTH_TRIGGERED  = 2;  // one sawtooth ramp per trigger
  CHIRP_MODE_TRIANGLE_TRIGGERED  = 3;  // one triangle ramp per trigger
}

// Reason a request could not be completed (see ErrorResponse).
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNSUPPORTED = 1;      // unknown message id, or a feature this board/firmware lacks
  ERROR_CODE_DECODE_FAILED = 2;    // the request packet failed to decode
  ERROR_CODE_INVALID_REQUEST = 3;  // arguments out of range / malformed
  ERROR_CODE_HARDWARE_ERROR = 4;   // the underlying device operation failed
}

message SetPllFrequencyRequest {
  int32 frequency_mhz = 1;
}

message SetRfBandRequest {
  RfBand band = 1;
}

message SetSwitchesRequest {
  RfSwitchOption rf_switch = 1;
  MixerSwitchOption mixer_switch = 2;
  IfSwitchOption if_switch = 3;
}

// Request messages
message SetCalibrationEnabledRequest {
  bool enabled = 1;
}

// Calibration source select (whalepod CAL_SEL line). The internal noise-source
// amplifier is enabled by the firmware only when calibration mode is active AND
// the internal source is selected.
message SetCalSourceRequest {
  bool internal = 1;  // false = external cal (CAL_SEL low), true = internal (high)
}

// STRAPS reference-clock source select (SI53301 CLK_SEL line, on GP27 via a
// board mod). Selects whether the LMX2595 is fed by the on-board oscillator or
// an external reference. No-op on boards without a switchable clock.
//
// This select carries `external`, the opposite sense to SetCalSourceRequest's
// `internal` above. The Go API still takes an `internal` bool and negates at
// this boundary, so the CLI and JSON surfaces are unaffected.
message SetClockSourceRequest {
  bool external = 1;  // false = internal on-board oscillator, true = external clock
}

message SetChannelsEnabledRequest {
  bool enabled = 1;
}

message SetAttenuationRequest {
  int32 attenuation_db = 1;
}

// PE42582 SP8T switch board: select which channel (1..8) routes to the common
// port. 0 (or any out-of-range value) puts the switch in the all-off /
// all-isolated state. The matching front-panel LED tracks the selection.
message SetRfSwitchChannelRequest {
  int32 channel = 1;
}


// Response messages
message SetCalibrationEnabledResponse {}

message SetCalSourceResponse {}

message SetClockSourceResponse {}

message SetAttenuationResponse {}

message SetChannelsEnabledResponse {}

message SetSwitchesResponse {}

message SetPllFrequencyResponse {}

message SetRfBandResponse {}

message SetRfSwitchChannelResponse {}

message GetStatusRequest {}

message SetCalAttenuationResponse {}

message SetFrontendAttenuationResponse {}

message SaveConfigRequest {
  bytes static_ip = 1;
  bytes static_gateway = 2;
  bytes static_subnet = 3;
  string mdns_hostname = 4;
  bool enable_gateway_check = 6;
  bytes mac_address = 7;
  string serial_number = 8;
}

message SaveConfigResponse {}

message GetStatusResponse {
  bool calibration_enabled = 1;
  int32 attenuation_db = 2;
  bool channels_enabled = 3;
  int32 lo_frequency_mhz = 4;
  RfSwitchOption rf_switch = 5;
  MixerSwitchOption mixer_switch = 6;
  IfSwitchOption if_switch = 7;
  // Hardware variant: "whalepod", "bc", "straps", or "rf_switch". Used by host
  // tools to suppress fields that aren't physically present (the Whalepod has no
  // switches or PLL, only attenuators).
  string board_type = 8;
  // Currently selected SP8T channel (1..8, or 0 = all-off) on the rf_switch
  // board. Meaningless on other variants.
  int32 rf_switch_channel = 9;
  // Whalepod calibration source: true = internal noise source (CAL_SEL high),
  // false = external (CAL_SEL low). Meaningless on variants without CAL_SEL.
  bool cal_source_internal = 10;
  // Whalepod cal-path attenuator setting in dB (the value last written to the
  // CAL_ATT attenuator). Distinct from attenuation_db, which is the frontend
  // attenuator. Meaningless on variants without a cal attenuator.
  int32 cal_attenuation_db = 11;
  // STRAPS reference-clock source: true = external clock, false = internal
  // on-board oscillator. Inverted relative to cal_source_internal above; see
  // the POLARITY note at the top. Meaningless on variants without a switchable
  // clock. (Firmware read-back pending — an unset field decodes as false, which
  // reads as "internal" here.)
  bool clock_source_external = 12;
  // Barracuda: ADF4159 MUXOUT digital lock-detect (true = PLL locked).
  bool pll_locked = 13;
  // Barracuda: LMK05318B locked to the 10 MHz reference (false = holdover/free-run).
  bool ref_locked = 14;
}

message GetConfigRequest {}

message GetConfigResponse {
  bytes static_ip = 1;
  bytes static_gateway = 2;
  bytes static_subnet = 3;
  string mdns_hostname = 4;
  bool enable_gateway_check = 6;
  string serial_number = 7;
  bytes mac_address = 8;
  string firmware_version = 9;
}

// EEPROM access (AT24C01D, 128 bytes). address/length are byte offsets into
// the device; data is capped at the device size.
message EepromReadRequest {
  uint32 address = 1;
  uint32 length = 2;
}

message EepromReadResponse {
  uint32 address = 1;
  bytes data = 2;
}

message EepromWriteRequest {
  uint32 address = 1;
  bytes data = 2;
}

message EepromWriteResponse {
  bool success = 1;
}

// Generic error reply. Sent when the firmware cannot handle a request at all —
// e.g. an unknown/unsupported message id, or a packet that failed to decode —
// so the host gets a definite answer instead of blocking until it times out.
message ErrorResponse {
  ErrorCode code = 1;
  string detail = 2;  // short human-readable context; may be empty
}

// LMX2595 LO synthesizer output (Barracuda). 0 powers the synth down. Distinct
// from SetPllFrequency, which targets the ADF4159/HMC733 VCO chain.
message SetLoFrequencyRequest {
  int32 frequency_mhz = 1;
}
message SetLoFrequencyResponse {}

// FMCW chirp control for the ADF4159 direct-modulation PLL (Barracuda). Programs
// the ramp and (dis)arms it. With enabled=false the PLL holds a CW tone at
// start_freq_mhz.
message SetChirpRequest {
  int32 start_freq_mhz = 1;  // VCO output at ramp start
  int32 deviation_mhz  = 2;  // chirp bandwidth (e.g. 1500 for 1.5 GHz)
  uint32 ramp_time_us  = 3;  // ramp duration in microseconds (e.g. 35)
  ChirpMode mode       = 4;
  bool enabled         = 5;  // true = arm/run the ramp, false = CW at start freq
  // ── Extended waveform options (all zero/false = the classic 5-field chirp) ──
  bool parabolic = 6;              // nonlinear ramp (§10.5); deviation_mhz is the TOTAL span.
                                   // Mutually exclusive with dual_ramp/fast_ramp.
  bool dual_ramp = 7;              // second ramp rate in bank 1 (fields 8/9)
  int32 ramp2_deviation_mhz = 8;   // dual ramp: bank-1 sweep span
  uint32 ramp2_time_us = 9;        // dual ramp: bank-1 ramp time
  bool fast_ramp = 10;             // two-slope triangular; down-slope time in field 11
  uint32 fast_ramp_down_time_us = 11;
  uint32 fsk_on_ramp_khz = 12;     // FSK deviation superimposed on the ramp; 0 = off
  bool delayed_start = 13;         // delay ramp start by delay_us
  bool ramp_delay = 14;            // dwell of delay_us between ramps
  uint32 delay_us = 15;            // duration used by fields 13/14/17
  bool triangular_delay = 16;      // clipped triangular (requires ramp_delay + a triangle mode)
  bool txdata_trigger_delay = 17;  // apply delay_us when TXDATA triggers a ramp
  bool external_step_clock = 18;   // TXDATA pin advances each ramp step (no internal clock)
  bool txdata_invert = 19;         // TXDATA events on the falling edge
  bool muxout_ramp_complete = 20;  // route the ramp-complete pulse to MUXOUT
                                   // (sacrifices lock-detect on that pin while enabled)
}
message SetChirpResponse {
  bool locked = 1;           // ADF4159 reported lock after programming
}

// Fine (0.25 dB) attenuation for the HMC1119 DSA (Barracuda). quarter_db is in
// 0.25 dB units, 0…127 (0…31.75 dB); distinct from SetAttenuation (whole dB).
message SetDsaAttenuationRequest {
  int32 quarter_db = 1;
}
message SetDsaAttenuationResponse {}

// ADF4159 FSK modulation (Barracuda). Programs center + deviation and enables
// FSK; the data stream itself is applied on the TXDATA pin by external
// hardware/test equipment. enabled=false reverts to CW at center_freq_mhz.
message SetFskRequest {
  int32 center_freq_mhz = 1;
  uint32 deviation_khz = 2;  // hop is ±deviation around center
  bool enabled = 3;
}
message SetFskResponse {}

// ADF4159 output-phase control (Barracuda).
enum PhaseMode {
  PHASE_MODE_OFF = 0;     // PSK and phase adjust disabled, phase word cleared
  PHASE_MODE_PSK = 1;     // PSK via TXDATA: +phase when high, −phase when low
  PHASE_MODE_STATIC = 2;  // one-shot static phase increment (relative to current phase)
}
message SetPhaseRequest {
  PhaseMode mode = 1;
  int32 phase_millidegrees = 2;  // e.g. 90000 = +90°; hardware resolution 360°/4096
}
message SetPhaseResponse {}

// ADF4159 reference-path configuration (Barracuda). f_PFD = REFIN×(1+doubler) /
// (r_counter×(1+div2)). The firmware revalidates the armed waveform at the new
// f_PFD and refuses (INVALID_REQUEST) any change that would push the output
// past the RF ceiling. Requires a frequency to have been programmed first.
message SetAdfRefConfigRequest {
  uint32 r_counter = 1;        // 1..32
  bool ref_doubler = 2;        // REFIN ≤ 50 MHz required; CP codes 0..7 only
  bool ref_div2 = 3;           // ÷2 after R counter (50% PFD duty, needed for CSR)
  bool prescaler_8_9 = 4;      // false = 4/5 (RF ≤ 8 GHz, INT ≥ 23); true = 8/9 (INT ≥ 75)
  uint32 cp_current_code = 5;  // 0..15, 0.31..5 mA at RSET = 5.1 kΩ
}
message SetAdfRefConfigResponse {}

// ADF4159 loop-quality features (Barracuda). FULL-STATE: every call applies all
// five fields; omitted fields fall back to their zero-value (= feature off).
message SetAdfLoopConfigRequest {
  bool csr = 1;                    // cycle slip reduction (needs CP code 0, +PD polarity)
  bool negative_bleed = 2;
  uint32 negative_bleed_code = 3;  // 0..7 → 3.73..916 µA
  bool lol_disable = 4;            // disable loss-of-lock indication (more robust lock detect)
  bool integer_n_mode = 5;         // Σ-Δ off, FRAC forced 0; disables chirp/FSK/PSK/phase
}
message SetAdfLoopConfigResponse {}

// ADF4159 power controls (Barracuda). FULL-STATE, like SetAdfLoopConfig.
message SetAdfPowerRequest {
  bool power_down = 1;     // software power-down (registers retained)
  bool cp_three_state = 2; // charge pump three-stated
  bool counter_reset = 3;  // RF counters held in reset
}
message SetAdfPowerResponse {}

// Packet message with all request and response types
message Packet {
  oneof message_id {
    SetCalibrationEnabledRequest set_cal_enabled_request = 1;
    SetCalibrationEnabledResponse set_cal_enabled_response = 2;
    SetAttenuationRequest set_frontend_attenuation_request = 3;
    SetChannelsEnabledRequest set_channels_enabled_request = 4;
    SetFrontendAttenuationResponse set_frontend_attenuation_response = 5;
    SetChannelsEnabledResponse set_channels_enabled_response = 6;
    GetStatusRequest get_status_request = 7;
    GetStatusResponse get_status_response = 8;
    SetSwitchesRequest set_switches_request = 9;
    SetSwitchesResponse set_switches_response = 10;
    SetPllFrequencyRequest set_pll_frequency_request = 11;
    SetPllFrequencyResponse set_pll_frequency_response = 12;
    SetRfBandRequest set_rf_band_request = 13;
    SetRfBandResponse set_rf_band_response = 14;
    SetAttenuationRequest set_cal_attenuation_request = 15;
    SetCalAttenuationResponse set_cal_attenuation_response = 16;
    SaveConfigRequest save_config_request = 17;
    SaveConfigResponse save_config_response = 18;
    GetConfigRequest get_config_request = 19;
    GetConfigResponse get_config_response = 20;
    EepromReadRequest eeprom_read_request = 21;
    EepromReadResponse eeprom_read_response = 22;
    EepromWriteRequest eeprom_write_request = 23;
    EepromWriteResponse eeprom_write_response = 24;
    SetRfSwitchChannelRequest set_rf_switch_channel_request = 25;
    SetRfSwitchChannelResponse set_rf_switch_channel_response = 26;
    SetCalSourceRequest set_cal_source_request = 27;
    SetCalSourceResponse set_cal_source_response = 28;
    ErrorResponse error_response = 29;
    SetClockSourceRequest set_clock_source_request = 30;
    SetClockSourceResponse set_clock_source_response = 31;
    SetLoFrequencyRequest set_lo_frequency_request = 32;
    SetLoFrequencyResponse set_lo_frequency_response = 33;
    SetChirpRequest set_chirp_request = 34;
    SetChirpResponse set_chirp_response = 35;
    SetDsaAttenuationRequest set_dsa_attenuation_request = 36;
    SetDsaAttenuationResponse set_dsa_attenuation_response = 37;
    // Barracuda ADF4159 extended control. 40-47 stay reserved for OTA.
    SetFskRequest set_fsk_request = 52;
    SetFskResponse set_fsk_response = 53;
    SetPhaseRequest set_phase_request = 54;
    SetPhaseResponse set_phase_response = 55;
    SetAdfRefConfigRequest set_adf_ref_config_request = 56;
    SetAdfRefConfigResponse set_adf_ref_config_response = 57;
    SetAdfLoopConfigRequest set_adf_loop_config_request = 58;
    SetAdfLoopConfigResponse set_adf_loop_config_response = 59;
    SetAdfPowerRequest set_adf_power_request = 60;
    SetAdfPowerResponse set_adf_power_response = 61;
  }
}