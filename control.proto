// control.proto — synced copy of the canonical RF-instrument firmware protocol.
//
// Canonical source: fw-discovery/examples/dhcp_dns/control.proto. Keep this file
// byte-for-byte identical except for this header and go_package, then regenerate:
//
//   protoc -I. --go_out=. --go_opt=module=github.com/OcupointInc/rf-control control.proto
//
// Do not hand-edit controlpb/control.pb.go.
syntax = "proto3";

package control;

option go_package = "github.com/OcupointInc/rf-control/controlpb;controlpb";

// Enums for each switch bank
enum RfSwitchOption {
  RF_SWITCH_OPTION_4GHZ_LPF = 0;
  RF_SWITCH_OPTION_2GHZ_LPF = 1;
}

enum MixerSwitchOption {
  MIXER_SWITCH_OPTION_MIXER = 0;
  MIXER_SWITCH_OPTION_BYPASS = 1;
}

enum IfSwitchOption {
  IF_SWITCH_OPTION_900MHZ_LPF = 0;
  IF_SWITCH_OPTION_1_2GHZ_BANDPASS = 1;
}

// Enum for RF bands
enum RfBand {
  RF_BAND_10_900MHZ = 0;
  RF_BAND_900_1800MHZ = 1;
  RF_BAND_1800_2700MHZ = 2;
  RF_BAND_2700_3600MHZ = 3;
  RF_BAND_3600_4500MHZ = 4;
}

// FMCW chirp/ramp shape for the ADF4159 (Barracuda). CONTINUOUS variants free-run
// once armed; TRIGGERED variants emit one ramp per TXDATA trigger pulse.
enum ChirpMode {
  CHIRP_MODE_SAWTOOTH_CONTINUOUS = 0;  // reset-to-start sawtooth, free-running
  CHIRP_MODE_TRIANGLE_CONTINUOUS = 1;  // up/down triangle, free-running
  CHIRP_MODE_SAWTOOTH_TRIGGERED  = 2;  // one sawtooth ramp per trigger
  CHIRP_MODE_TRIANGLE_TRIGGERED  = 3;  // one triangle ramp per trigger
}

// Reason a request could not be completed (see ErrorResponse).
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNSUPPORTED = 1;      // unknown message id, or a feature this board/firmware lacks
  ERROR_CODE_DECODE_FAILED = 2;    // the request packet failed to decode
  ERROR_CODE_INVALID_REQUEST = 3;  // arguments out of range / malformed
  ERROR_CODE_HARDWARE_ERROR = 4;   // the underlying device operation failed
}

message SetPllFrequencyRequest {
  int32 frequency_mhz = 1;
}

message SetRfBandRequest {
  RfBand band = 1;
}

message SetSwitchesRequest {
  RfSwitchOption rf_switch = 1;
  MixerSwitchOption mixer_switch = 2;
  IfSwitchOption if_switch = 3;
}

// Request messages
message SetCalibrationEnabledRequest {
  bool enabled = 1;
}

// Calibration source select (whalepod CAL_SEL line). The internal noise-source
// amplifier is enabled by the firmware only when calibration mode is active AND
// the internal source is selected.
message SetCalSourceRequest {
  bool internal = 1;  // false = external cal (CAL_SEL low), true = internal (high)
}

message SetChannelsEnabledRequest {
  bool enabled = 1;
}

message SetAttenuationRequest {
  int32 attenuation_db = 1;
}

// PE42582 SP8T switch board: select which channel (1..8) routes to the common
// port. 0 (or any out-of-range value) puts the switch in the all-off /
// all-isolated state. The matching front-panel LED tracks the selection.
message SetRfSwitchChannelRequest {
  int32 channel = 1;
}


// Response messages
message SetCalibrationEnabledResponse {}

message SetCalSourceResponse {}

message SetAttenuationResponse {}

message SetChannelsEnabledResponse {}

message SetSwitchesResponse {}

message SetPllFrequencyResponse {}

message SetRfBandResponse {}

message SetRfSwitchChannelResponse {}

message GetStatusRequest {}

message SetCalAttenuationResponse {}

message SetFrontendAttenuationResponse {}

message SaveConfigRequest {
  bytes static_ip = 1;
  bytes static_gateway = 2;
  bytes static_subnet = 3;
  string mdns_hostname = 4;
  bool enable_gateway_check = 6;
  bytes mac_address = 7;
  string serial_number = 8;
}

message SaveConfigResponse {}

// Result of probing a pin the MCU does not drive: apply the internal pull-up,
// then the internal pull-down, and see whether the pin followed. Values match
// gpio_stuck_t in gpio_verify.h exactly — do not reorder.
enum PinProbe {
  PIN_PROBE_FLOATING = 0;  // followed both pulls — nothing is driving it
  PIN_PROBE_LOW      = 1;  // held low against the internal pull-up
  PIN_PROBE_HIGH     = 2;  // held high against the internal pull-down
}

// Feature discovery for Barracuda hosts. These flags describe protocol/firmware
// support, not whether a feature is currently enabled.
message BarracudaCapabilities {
  bool extended_chirp = 1;
  bool fsk = 2;
  bool phase = 3;
  bool adf_ref_config = 4;
  bool adf_loop_config = 5;
  bool adf_power = 6;
  bool lmx_register_read = 7;
  bool gpio_self_test = 8;
  uint32 adf_max_frequency_mhz = 9;
  uint32 max_lmx_register_batch = 10;
  bool lmk_reference_frequency = 11;
  uint32 lmk_reference_min_hz = 12;
  uint32 lmk_reference_max_hz = 13;
  bool equalized_sweep = 14;
  uint32 equalized_sweep_max_points = 15;
  uint32 dsa_min_latch_interval_us = 16;
  bool lmx_output_power = 17;
}

// Authoritative ADF4159 driver-shadow state. The ADF4159 is write-only except
// for accumulator readback, so these fields report what the firmware most
// recently programmed; `pll_locked` remains the independent electrical result.
message Adf4159State {
  bool ready = 1;
  uint32 pfd_frequency_hz = 2;
  int32 frequency_mhz = 3;
  bool ramp_enabled = 4;
  ChirpMode ramp_mode = 5;
  bool fsk_enabled = 6;
  bool psk_enabled = 7;
  bool static_phase_enabled = 8;
  int32 phase_millidegrees = 9;
  uint32 r_counter = 10;
  bool ref_doubler = 11;
  bool ref_div2 = 12;
  bool prescaler_8_9 = 13;
  uint32 cp_current_code = 14;
  bool csr = 15;
  bool negative_bleed = 16;
  uint32 negative_bleed_code = 17;
  bool lol_disable = 18;
  bool integer_n_mode = 19;
  bool power_down = 20;
  bool cp_three_state = 21;
  bool counter_reset = 22;
  bool parabolic = 23;
  bool dual_ramp = 24;
  bool fast_ramp = 25;
  bool fsk_on_ramp = 26;
  bool delayed_start = 27;
  bool ramp_delay = 28;
  bool triangular_delay = 29;
  bool txdata_trigger_delay = 30;
  bool external_step_clock = 31;
  bool txdata_invert = 32;
  bool muxout_ramp_complete = 33;
  bool lock_detect_available = 34;
}

// Barracuda-only bring-up diagnostics.
//
// These used to be packed into switch-board fields (attenuation_db carried the
// ADF readback word, cal_attenuation_db the LMK registers, rf_switch_channel the
// I2C levels). That was expedient during bring-up but it cost real debugging
// time: one block silently clobbered another's result, and host-side decoders
// matched the wrong field by prefix. Everything Barracuda-specific lives here
// now, named for what it actually is.
message BarracudaDiagnostics {
  // ADF4159 SPI round trip — the 37-bit ramp-accumulator readback, taken once at
  // boot (it reprograms the part and restores, so it must not run per-poll).
  // Purely digital: valid with no lock, no loop filter and no RF.
  //   0xC8000000 = pass. INT = word >> 25 = 100, FRAC = word & 0x1FFFFFF = 0
  //   0x00000000 = MUXOUT never moved         all-ones = stuck high
  uint32 adf_readback_word = 1;
  bool   adf_readback_ran  = 2;   // false = the readback never executed

  // LMX2595 register readback over its MUXout/SDO, which lands on the MCU's real
  // SPI MISO with no level shifter. Needs no tuning, no VCO cal and no lock —
  // only power and a working bus, so it is a clean bidirectional link test.
  // Expect r0 = 0x2510 (the configured 0x251C with MUXOUT_LD_SEL and FCAL_EN
  // cleared for the read). Both zero = SDO dead or part not responding.
  uint32 lmx_r0 = 3;
  uint32 lmx_r1 = 4;

  // LMK05318B, all read-only so it is safe on every poll. r10 is the address
  // readback: 0xC8 = 0x64 << 1, the part reporting its own address. Note it can
  // ACK while returning 0x00 — that state means "needs a power cycle", not a
  // hardware fault, and only a power cycle re-runs the RAM config.
  bool   lmk_present  = 5;        // false = no ACK at all
  uint32 lmk_r10      = 6;
  uint32 lmk_status0  = 7;        // R13
  uint32 lmk_status1  = 8;        // R14

  // I2C0 idle levels. The bus pull-ups are 4.7k to V_3V3_ID, so with that rail
  // up both must read HIGH when released. FLOATING means no effective pull-up
  // (V_3V3_ID down or FB_id open); LOW means something is holding the bus.
  PinProbe i2c_sda_level = 9;
  PinProbe i2c_scl_level = 10;
  // Devices confirmed by routine non-disruptive status probes. Barracuda
  // currently probes only the LMK here; EEPROM reachability is tested by its
  // dedicated read command rather than by sweeping the entire address space.
  uint32   i2c_device_count = 11;

  // Return-path probes. LOCK_DET is the ADF4159's MUXOUT through the TXB0104;
  // SPI_MISO is the LMX2595's MUXout direct. FLOATING with a module fitted means
  // nothing is driving that net; compare against a module-removed baseline,
  // where FLOATING is the correct answer for both.
  PinProbe lock_det_level = 12;
  PinProbe spi_miso_level = 13;

  // Result of the last lmk05318b_init() config apply. HW_SW_CTRL = 1 makes the
  // RAM register set authoritative, so this ~334-register table is the entire
  // clock plan — if part of it fails to land, individual outputs misbehave while
  // the device still ACKs and still reports a healthy R10. cfg_first_mismatch is
  // the first address whose stable writable bits did not read back (0xFFFF =
  // none), which localises a partial config to a register block. Read-only,
  // live-status, self-clearing, unimplemented and indirect-data bytes are
  // excluded from the comparison.
  uint32 lmk_cfg_writes         = 14;
  uint32 lmk_cfg_mismatches     = 15;
  uint32 lmk_cfg_first_mismatch = 16;
  // Every address whose stable writable configuration bits failed readback.
  repeated uint32 lmk_cfg_mismatch_addrs = 17;

  // ADF4159 link self-test — the forced-override MUXOUT probe. Commands MUXOUT
  // to DVDD / DGND / three-state and, for each, forces LOCK_DET to both
  // polarities first and reads what it settles back to. Forcing is what makes
  // the result mean anything at the MCU end: the TXB0104's ~4k output keeper
  // otherwise holds its last level, so "the ADF is driving low" and "nothing is
  // driving" read identically. Six observations, each sampled twice: bits 0-5
  // are the SLOW sample (2 ms after release), bits 8-13 the same six FAST
  // (50 us — past the TXB0104's release-edge transient, which with the base
  // board's 1 nF filter cap runs tau ~= 4 us). 1 = read HIGH. Fast and slow
  // agreeing means the level is settled; disagreement means still slewing and
  // the slow sample is the one to believe.
  //   bit0/1  MUXOUT DVDD        forced low / high  -> expect 1 / 1
  //   bit2/3  MUXOUT DGND        forced low / high  -> expect 0 / 0
  //   bit4/5  MUXOUT three-state forced low / high  -> expect 0 / 1
  // The three-state pair is the negative control and must follow the force.
  // Reading the slow byte:
  //   0x23 = pass — both rails commanded and observed; the link works
  //   0x2A = net follows the MCU every time -> nothing is driving MUXOUT, so
  //          the return path is fine and the ADF is not executing writes
  //   0x00 / 0x3F = net held low / high even against the force: a short, a
  //          dead pad, or an UNPOWERED device clamping the net through its ESD
  //          diodes — module power absent reads exactly like a short here, so
  //          check module power (is the LMX also silent?) before probing.
  // Taken once at boot: an R0 write is the ADF's frequency-load event, so this
  // must not run per-poll.
  // Backward-compatible normalized slow sample (bits 0-5 only). A pass is
  // exactly 0x23; use adf_link_probe_raw for timing/marginality diagnostics.
  uint32 adf_link_probe     = 18;
  bool   adf_link_probe_ran = 19;   // false = the probe never executed

  // LMK R72 CH_ACT (RO, live): bit0 CH0_1, bit1 CH2_3, bit2 CH4, bit3 CH5,
  // bit4 CH6, bit5 CH7 — 1 = that channel's regulator/divider is powered and
  // active. The boot default is 0x01 (CH0_1 only), but the runtime clock-output
  // command can change it. This is the LMK's own claim about each output channel, so a dead output pin
  // with its ACT bit set is a board-level fault, not a configuration fault.
  uint32 lmk_ch_act = 20;

  // True when SDA/SCL pad levels were sampled this poll. Status samples them
  // without changing their I2C pin function, and only when the LMK is
  // unreachable. When false, i2c_sda_level / i2c_scl_level carry no data.
  bool i2c_pins_probed = 21;

  // LMX2595 live configuration/status readback. These are the registers most
  // useful for a non-disruptive production self-test: output power/down state,
  // output muxes, channel divider, lock state, and VCO calibration results.
  uint32 lmx_r44  = 22;
  uint32 lmx_r45  = 23;
  uint32 lmx_r46  = 24;
  uint32 lmx_r75  = 25;
  uint32 lmx_r110 = 26;
  uint32 lmx_r111 = 27;
  uint32 lmx_r112 = 28;
  // Raw R110[10:9] rb_LD_VTUNE: 0/3 = unlocked, 1 = invalid, 2 = locked.
  uint32 lmx_lock_state = 29;
  bool   lmx_locked = 30;
  // True when the stable programmed registers above match the driver's shadow
  // image. Read-only live status/calibration fields R110-R112 are not compared.
  bool   lmx_readback_ok = 31;

  // Normalized results for production tests. adf_link_ok requires both the
  // fast and slow six-bit samples to equal 0x23; raw 0x2323 is therefore PASS.
  bool adf_link_ok = 32;
  bool adf_readback_ok = 33; // accumulator word equals 0xC8000000
  // Original two-sample encoding: slow bits 0-5, fast bits 8-13. A clean pass
  // is 0x2323. Kept separately so adf_link_probe remains simple for old tests.
  uint32 adf_link_probe_raw = 34;

  BarracudaCapabilities capabilities = 35;
  Adf4159State adf_state = 36;
  // Live LMK OUT0/1 divider and derived output frequency. The coordinated
  // setter keeps OUT1/4/5/6 on this same integer divide of the 2.5 GHz VCO.
  uint32 lmk_reference_frequency_hz = 37;
  uint32 lmk_reference_divider = 38;
  // LMX setpoint and actual integer-N output after reference-clock retuning.
  uint64 lmx_requested_frequency_hz = 39;
  uint64 lmx_actual_frequency_hz = 40;
  // DPLL/reference-selection detail used to distinguish a missing PRIREF from
  // a valid reference that the DPLL has not selected or locked to.
  uint32 lmk_refsel = 41;       // R167: selected reference (PRIREF = 1)
  uint32 lmk_dpll_lock = 42;    // R168: frequency/phase lock state
  uint32 lmk_ref_valid = 43;    // R411: PRIREF validation state
  uint32 lmx_output_power_code = 44; // OUTA_PWR, R44[13:8], 0..63
  bool lmx_output_power_manual = 45; // false = frequency-aware automatic table
}

message GetStatusResponse {
  bool calibration_enabled = 1;
  int32 attenuation_db = 2;
  bool channels_enabled = 3;
  int32 lo_frequency_mhz = 4;
  RfSwitchOption rf_switch = 5;
  MixerSwitchOption mixer_switch = 6;
  IfSwitchOption if_switch = 7;
  // Hardware variant: "whalepod", "bc", "straps", or "rf_switch". Used by host
  // tools to suppress fields that aren't physically present (the Whalepod has no
  // switches or PLL, only attenuators).
  string board_type = 8;
  // Currently selected SP8T channel (1..8, or 0 = all-off) on the rf_switch
  // board. Meaningless on other variants.
  int32 rf_switch_channel = 9;
  // Whalepod calibration source: true = internal noise source (CAL_SEL high),
  // false = external (CAL_SEL low). Meaningless on variants without CAL_SEL.
  bool cal_source_internal = 10;
  // Whalepod cal-path attenuator setting in dB (the value last written to the
  // CAL_ATT attenuator). Distinct from attenuation_db, which is the frontend
  // attenuator. Meaningless on variants without a cal attenuator.
  int32 cal_attenuation_db = 11;
  // Barracuda LMK control source: true = external 10 MHz PRIREF/DPLL,
  // false = internal 100 MHz XO/APLL-only (inverted vs cal_source_internal).
  bool clock_source_external = 12;
  // Barracuda: ADF4159 MUXOUT digital lock-detect (true = PLL locked).
  bool pll_locked = 13;
  // Barracuda: LMK05318B locked to the 10 MHz reference (false = holdover/free-run).
  bool ref_locked = 14;
  // Barracuda only; absent on every other variant. Host tools should gate on
  // board_type == "barracuda" rather than on presence.
  BarracudaDiagnostics barracuda = 15;
  // RP2040/W55RP20 internal die-temperature sensor. This is not a substitute
  // for a calibrated external board-temperature sensor.
  float mcu_temperature_c = 16;
  reserved 17 to 19; // used only by pre-release ADC diagnostics
  // True when mcu_temperature_c is the first post-boot ADC sample cached by the
  // firmware. Barracuda sets this because repeat conversions on its W55RP20
  // internal temperature channel are not reliable.
  bool mcu_temperature_is_boot_sample = 20;
}

message GetConfigRequest {}

message GetConfigResponse {
  bytes static_ip = 1;
  bytes static_gateway = 2;
  bytes static_subnet = 3;
  string mdns_hostname = 4;
  bool enable_gateway_check = 6;
  string serial_number = 7;
  bytes mac_address = 8;
  string firmware_version = 9;
  // Factory-unique 64-bit flash/board ID exposed by the Pico SDK, formatted
  // as 16 hexadecimal characters. This is distinct from serial_number, which
  // is user-configurable test/asset metadata.
  string unique_board_id = 10;
}

// EEPROM access (AT24C01D, 128 bytes). address/length are byte offsets into
// the device; data is capped at the device size.
message EepromReadRequest {
  uint32 address = 1;
  uint32 length = 2;
}

message EepromReadResponse {
  uint32 address = 1;
  bytes data = 2;
}

message EepromWriteRequest {
  uint32 address = 1;
  bytes data = 2;
}

message EepromWriteResponse {
  bool success = 1;
}

// Generic error reply. Sent when the firmware cannot handle a request at all —
// e.g. an unknown/unsupported message id, or a packet that failed to decode —
// so the host gets a definite answer instead of blocking until it times out.
message ErrorResponse {
  ErrorCode code = 1;
  string detail = 2;  // short human-readable context; may be empty
}

// Reference-clock source selection. On Barracuda, external selects LMK DPLL
// mode disciplined by 10 MHz PRIREF; internal selects APLL-only free-run from
// the onboard 100 MHz XO. The 20 MHz output plan is unchanged. `external` is
// the OPPOSITE sense to SetCalSource.internal.
message SetClockSourceRequest {
  bool external = 1;  // false = internal on-board oscillator, true = external clock
}
message SetClockSourceResponse {
  bool external = 1;               // live PLL1_MODE readback
  bool reference_valid = 2;        // PRIREF validation state
  bool reference_selected = 3;     // PRIREF is the DPLL input; `external` says whether DPLL controls VCO1
  bool dpll_frequency_locked = 4;
  bool dpll_phase_locked = 5;
}

// LMX2595 LO synthesizer output (Barracuda). 0 powers the synth down. Distinct
// from SetPllFrequency, which targets the ADF4159/HMC733 VCO chain.
message SetLoFrequencyRequest {
  int32 frequency_mhz = 1;
}
message SetLoFrequencyResponse {}

// Manual LMX2595 RFOUTA drive selection. The six-bit code is written directly
// to OUTA_PWR and remains in force across later LO retunes. Reboot restores the
// frequency-aware automatic setting (code 50 below 13.3 GHz).
message SetLmxOutputPowerRequest {
  uint32 power_code = 1; // 0..63
}
message SetLmxOutputPowerResponse {}

// FMCW chirp control for the ADF4159 direct-modulation PLL (Barracuda). Programs
// the ramp and (dis)arms it. With enabled=false the PLL holds a CW tone at
// start_freq_mhz.
message SetChirpRequest {
  int32 start_freq_mhz = 1;  // VCO output at ramp start
  int32 deviation_mhz  = 2;  // chirp bandwidth (e.g. 1500 for 1.5 GHz)
  uint32 ramp_time_us  = 3;  // ramp duration in microseconds (e.g. 35)
  ChirpMode mode       = 4;
  bool enabled         = 5;  // true = arm/run the ramp, false = CW at start freq
  // ── Extended waveform options (all zero/false = the classic 5-field chirp) ──
  bool parabolic = 6;              // nonlinear ramp (§10.5); deviation_mhz is the TOTAL span.
                                   // Mutually exclusive with dual_ramp/fast_ramp.
  bool dual_ramp = 7;              // second ramp rate in bank 1 (fields 8/9)
  int32 ramp2_deviation_mhz = 8;   // dual ramp: bank-1 sweep span
  uint32 ramp2_time_us = 9;        // dual ramp: bank-1 ramp time
  bool fast_ramp = 10;             // two-slope triangular; down-slope time in field 11
  uint32 fast_ramp_down_time_us = 11;
  uint32 fsk_on_ramp_khz = 12;     // FSK deviation superimposed on the ramp; 0 = off
  bool delayed_start = 13;         // delay ramp start by delay_us
  bool ramp_delay = 14;            // dwell of delay_us between ramps
  uint32 delay_us = 15;            // duration used by fields 13/14/17
  bool triangular_delay = 16;      // clipped triangular (requires ramp_delay + a triangle mode)
  bool txdata_trigger_delay = 17;  // apply delay_us when TXDATA triggers a ramp
  bool external_step_clock = 18;   // TXDATA pin advances each ramp step (no internal clock)
  bool txdata_invert = 19;         // TXDATA events on the falling edge
  bool muxout_ramp_complete = 20;  // route the ramp-complete pulse to MUXOUT
                                   // (sacrifices lock-detect on that pin while enabled)
}
// NOTE: with muxout_ramp_complete the MUXOUT pin no longer carries lock detect,
// so `locked` here (and pll_locked in GetStatus) is not meaningful while it is
// routed — the firmware returns the lock state sampled BEFORE rerouting.
message SetChirpResponse {
  bool locked = 1;           // ADF4159 reported lock after programming
}

// Fine (0.25 dB) attenuation for the HMC1119 DSA (Barracuda). quarter_db is in
// 0.25 dB units, 0…127 (0…31.75 dB); distinct from SetAttenuation (whole dB).
message SetDsaAttenuationRequest {
  int32 quarter_db = 1;
}
message SetDsaAttenuationResponse {}

// UDP network auto-discovery (port 5001). A discoverer broadcasts one datagram
// containing a Packet{discovery_request}; every device answers with ONE unicast
// datagram (Packet{discovery_response}) back to the sender's ip:port. There is no
// length framing — the datagram boundary is the message boundary. Devices reply
// to both limited (255.255.255.255) and subnet-directed broadcasts. See discovery.c.
message DiscoveryRequest {}

message DiscoveryResponse {
  string board = 1;             // firmware target name, e.g. "whalepod_automation"
  string firmware_version = 2;  // build version string
  bytes  mac = 3;               // 6 bytes
  bytes  ip = 4;                // 4 bytes, network order
  uint32 control_port = 5;      // TCP port of the protobuf control server (5000)
  string serial = 6;            // EEPROM serial if provisioned, else RP2 unique-id hex
  string name = 7;              // optional friendly name (empty if unset)
}

// Firmware update over Ethernet/USB. Ethernet updates use the dedicated
// length-framed TCP service on port 5002 because data packets may span TCP
// segments. The running app stages and verifies the image; a small immutable
// bootloader applies it after reboot. Board identity is checked before erase.
message FwUpdateBeginRequest {
  uint32 size = 1;
  uint32 crc32 = 2;
  string board = 3;
  string version = 4;
}
message FwUpdateBeginResponse {
  uint32 max_chunk = 1;
}
message FwUpdateDataRequest {
  uint32 offset = 1;
  bytes data = 2;
}
message FwUpdateDataResponse {
  uint32 next_offset = 1;
}
message FwUpdateCommitRequest {}
message FwUpdateCommitResponse {
  bool crc_ok = 1;
}
message FwUpdateAbortRequest {}
message FwUpdateAbortResponse {}

// ── GPIO self-test (diagnostic) ──────────────────────────────────────────────
// Drives every board control pin LOW then HIGH, reading the pad input buffer
// back each time (the actual pin voltage — see gpio_verify.c), to find a control
// line that can't follow its output: shorted to a rail, a dead driver, or an
// external fault. DISRUPTIVE — it momentarily toggles power-enable / select /
// chip-select lines — so the firmware snapshots and restores each pin as it goes
// and re-asserts the latched attenuator state at the end. For bench bring-up and
// field fault-finding.
enum GpioStuckState {
  GPIO_STUCK_STATE_NONE = 0;  // pin toggled cleanly in both directions
  GPIO_STUCK_STATE_LOW  = 1;  // driven HIGH but read LOW  (stuck low / shorted to GND)
  GPIO_STUCK_STATE_HIGH = 2;  // driven LOW  but read HIGH (stuck high / shorted to a rail)
}

message GpioPinResult {
  uint32 pin = 1;             // RP2040 GPIO number
  string name = 2;            // board signal name, e.g. "CAL_SW"
  bool passed = 3;            // true = toggled cleanly both ways (at some drive)
  GpioStuckState stuck = 4;   // failure direction; NONE when passed
  // Lowest pad drive strength (nominal mA: 2/4/8/12) at which the pin toggled
  // cleanly both ways during the drive sweep; 0 = failed even at 12 mA. A value
  // above the board default (4 mA, or 12 mA for switch lines) means the pad is
  // marginal — flux/leakage the firmware can still drive through, but a sign the
  // board is degrading. See gpio_verify.c gpio_selftest_sweep().
  uint32 min_drive_ma = 5;
}

message GpioSelfTestRequest {}

message GpioSelfTestResponse {
  bool all_passed = 1;
  repeated GpioPinResult pins = 2;
}

// Non-disruptive batched LMX2595 register readback for production diagnostics.
// Up to 16 addresses may be requested per transaction. The response arrays are
// index-aligned. Only R0..R112 are valid.
message Lmx2595RegisterReadRequest {
  repeated uint32 addresses = 1;
}

message Lmx2595RegisterReadResponse {
  repeated uint32 addresses = 1;
  repeated uint32 values = 2;
  bool success = 3;
}

// ADF4159 FSK modulation (Barracuda). Programs center + deviation and enables
// FSK; the data stream itself is applied on the TXDATA pin by external
// hardware/test equipment. enabled=false reverts to CW at center_freq_mhz.
message SetFskRequest {
  int32 center_freq_mhz = 1;
  uint32 deviation_khz = 2;  // hop is ±deviation around center
  bool enabled = 3;
}
message SetFskResponse {}

// ADF4159 output-phase control (Barracuda).
enum PhaseMode {
  PHASE_MODE_OFF = 0;     // PSK and phase adjust disabled, phase word cleared
  PHASE_MODE_PSK = 1;     // PSK via TXDATA: +phase when high, −phase when low
  PHASE_MODE_STATIC = 2;  // one-shot static phase increment (relative to current phase)
}
message SetPhaseRequest {
  PhaseMode mode = 1;
  int32 phase_millidegrees = 2;  // e.g. 90000 = +90°; hardware resolution 360°/4096
}
message SetPhaseResponse {}

// ADF4159 reference-path configuration (Barracuda). f_PFD = REFIN×(1+doubler) /
// (r_counter×(1+div2)). The firmware revalidates the armed waveform at the new
// f_PFD and refuses (INVALID_REQUEST) any change that would push the output
// past the RF ceiling. Requires a frequency to have been programmed first.
message SetAdfRefConfigRequest {
  uint32 r_counter = 1;        // 1..32
  bool ref_doubler = 2;        // REFIN ≤ 50 MHz required; CP codes 0..7 only
  bool ref_div2 = 3;           // ÷2 after R counter (50% PFD duty, needed for CSR)
  bool prescaler_8_9 = 4;      // false = 4/5 (RF ≤ 8 GHz, INT ≥ 23); true = 8/9 (INT ≥ 75)
  uint32 cp_current_code = 5;  // 0..15, 0.31..5 mA at RSET = 5.1 kΩ
}
message SetAdfRefConfigResponse {}

// ADF4159 loop-quality features (Barracuda). FULL-STATE: every call applies all
// five fields; omitted fields fall back to their zero-value (= feature off).
message SetAdfLoopConfigRequest {
  bool csr = 1;                    // cycle slip reduction (needs CP code 0, +PD polarity)
  bool negative_bleed = 2;
  uint32 negative_bleed_code = 3;  // 0..7 → 3.73..916 µA
  bool lol_disable = 4;            // disable loss-of-lock indication (more robust lock detect)
  bool integer_n_mode = 5;         // Σ-Δ off, FRAC forced 0; disables chirp/FSK/PSK/phase
}
message SetAdfLoopConfigResponse {}

// ADF4159 power controls (Barracuda). FULL-STATE, like SetAdfLoopConfig.
message SetAdfPowerRequest {
  bool power_down = 1;     // software power-down (registers retained)
  bool cp_three_state = 2; // charge pump three-stated
  bool counter_reset = 3;  // RF counters held in reset
}
message SetAdfPowerResponse {}

// LMK05318B reference output controls (Barracuda). FULL-STATE: every request
// explicitly sets all four routed clocks. Changes are RAM-only and take effect
// immediately; the boot defaults are restored on reset/power-cycle.
message SetLmkClockOutputsRequest {
  bool lmx_enabled   = 1; // OUT1 differential pair -> LMX2595 OSCin
  bool adf_enabled   = 2; // OUT4 single-ended -> ADF4159 REFIN
  bool sma_a_enabled = 3; // OUT5 -> front-panel CLKOUT_A
  bool sma_b_enabled = 4; // OUT6 -> front-panel CLKOUT_B
}
message SetLmkClockOutputsResponse {
  // Live LMK R72 CH_ACT readback after the write. Relevant bits are bit0
  // OUT1 pair, bit2 OUT4, bit3 OUT5, and bit4 OUT6.
  uint32 active_mask = 1;
}

// Coordinated Barracuda reference-clock change. The LMK uses an integer output
// divider on a fixed 2.5 GHz VCO, so actual_frequency_hz can differ slightly
// from the request. The firmware briefly mutes all routed LMK outputs, verifies
// all four divider writes, restores their prior enable state, and recalculates
// both downstream synthesizers for the actual clock. The ADF R counter is
// selected automatically to keep its PFD <= 110 MHz. RAM-only; reboot restores
// the 20 MHz (/125) boot plan. Only accepted while the ADF4159 is in plain CW.
message SetLmkReferenceFrequencyRequest {
  uint32 requested_frequency_hz = 1;
}
message SetLmkReferenceFrequencyResponse {
  uint32 actual_frequency_hz = 1;
  uint32 divider = 2;
  uint64 lmx_requested_frequency_hz = 3;
  uint64 lmx_actual_frequency_hz = 4;
  uint32 adf_r_counter = 5;
  uint32 adf_pfd_frequency_hz = 6;
}

// One attenuation state in a triggered, one-shot Barracuda sweep. The first
// point must equal start_frequency_khz. Later values are latched when the ADF
// ramp reaches their frequency; adjacent latch events need at least 3 us.
message EqualizedSweepPoint {
  uint32 frequency_khz = 1;
  uint32 quarter_db = 2;       // HMC1119 code, 0..127 (0..31.75 dB)
}

message RunEqualizedSweepRequest {
  uint32 start_frequency_khz = 1;
  uint32 stop_frequency_khz = 2;
  uint32 sweep_time_us = 3;
  repeated EqualizedSweepPoint points = 4;
  uint32 lo_frequency_mhz = 5; // 0 keeps the current LMX setting
  bool restore_entry_state = 6; // return ADF + LMX + DSA to entry state afterward
}

message RunEqualizedSweepResponse {
  uint32 applied_points = 1;
  uint32 minimum_sweep_time_us = 2;
  uint32 actual_sweep_time_us = 3;
  bool locked_before = 4;
  bool locked_after = 5;
  bool restored = 6;
  bool ramp_complete_observed = 7;
  bool txdata_triggered = 8;
}

// Packet message with all request and response types
message Packet {
  oneof message_id {
    SetCalibrationEnabledRequest set_cal_enabled_request = 1;
    SetCalibrationEnabledResponse set_cal_enabled_response = 2;
    SetAttenuationRequest set_frontend_attenuation_request = 3;
    SetChannelsEnabledRequest set_channels_enabled_request = 4;
    SetFrontendAttenuationResponse set_frontend_attenuation_response = 5;
    SetChannelsEnabledResponse set_channels_enabled_response = 6;
    GetStatusRequest get_status_request = 7;
    GetStatusResponse get_status_response = 8;
    SetSwitchesRequest set_switches_request = 9;
    SetSwitchesResponse set_switches_response = 10;
    SetPllFrequencyRequest set_pll_frequency_request = 11;
    SetPllFrequencyResponse set_pll_frequency_response = 12;
    SetRfBandRequest set_rf_band_request = 13;
    SetRfBandResponse set_rf_band_response = 14;
    SetAttenuationRequest set_cal_attenuation_request = 15;
    SetCalAttenuationResponse set_cal_attenuation_response = 16;
    SaveConfigRequest save_config_request = 17;
    SaveConfigResponse save_config_response = 18;
    GetConfigRequest get_config_request = 19;
    GetConfigResponse get_config_response = 20;
    EepromReadRequest eeprom_read_request = 21;
    EepromReadResponse eeprom_read_response = 22;
    EepromWriteRequest eeprom_write_request = 23;
    EepromWriteResponse eeprom_write_response = 24;
    SetRfSwitchChannelRequest set_rf_switch_channel_request = 25;
    SetRfSwitchChannelResponse set_rf_switch_channel_response = 26;
    SetCalSourceRequest set_cal_source_request = 27;
    SetCalSourceResponse set_cal_source_response = 28;
    ErrorResponse error_response = 29;
    SetClockSourceRequest set_clock_source_request = 30;
    SetClockSourceResponse set_clock_source_response = 31;
    SetLoFrequencyRequest set_lo_frequency_request = 32;
    SetLoFrequencyResponse set_lo_frequency_response = 33;
    SetChirpRequest set_chirp_request = 34;
    SetChirpResponse set_chirp_response = 35;
    SetDsaAttenuationRequest set_dsa_attenuation_request = 36;
    SetDsaAttenuationResponse set_dsa_attenuation_response = 37;
    // Network auto-discovery. Tags 30-37 are already claimed (SetClockSource +
    // the Barracuda verbs) and must stay identical to the rf-control host
    // library's control.proto, so discovery takes the next free pair.
    DiscoveryRequest discovery_request = 38;
    DiscoveryResponse discovery_response = 39;
    // Firmware update owns the previously reserved tags 40-47.
    FwUpdateBeginRequest fw_update_begin_request = 40;
    FwUpdateBeginResponse fw_update_begin_response = 41;
    FwUpdateDataRequest fw_update_data_request = 42;
    FwUpdateDataResponse fw_update_data_response = 43;
    FwUpdateCommitRequest fw_update_commit_request = 44;
    FwUpdateCommitResponse fw_update_commit_response = 45;
    FwUpdateAbortRequest fw_update_abort_request = 46;
    FwUpdateAbortResponse fw_update_abort_response = 47;
    // GPIO self-test diagnostic.
    GpioSelfTestRequest gpio_self_test_request = 48;
    GpioSelfTestResponse gpio_self_test_response = 49;
    // Barracuda LMX2595 arbitrary register readback diagnostic.
    Lmx2595RegisterReadRequest lmx2595_register_read_request = 50;
    Lmx2595RegisterReadResponse lmx2595_register_read_response = 51;
    // Barracuda ADF4159 extended control.
    SetFskRequest set_fsk_request = 52;
    SetFskResponse set_fsk_response = 53;
    SetPhaseRequest set_phase_request = 54;
    SetPhaseResponse set_phase_response = 55;
    SetAdfRefConfigRequest set_adf_ref_config_request = 56;
    SetAdfRefConfigResponse set_adf_ref_config_response = 57;
    SetAdfLoopConfigRequest set_adf_loop_config_request = 58;
    SetAdfLoopConfigResponse set_adf_loop_config_response = 59;
    SetAdfPowerRequest set_adf_power_request = 60;
    SetAdfPowerResponse set_adf_power_response = 61;
    SetLmkClockOutputsRequest set_lmk_clock_outputs_request = 62;
    SetLmkClockOutputsResponse set_lmk_clock_outputs_response = 63;
    SetLmkReferenceFrequencyRequest set_lmk_reference_frequency_request = 64;
    SetLmkReferenceFrequencyResponse set_lmk_reference_frequency_response = 65;
    RunEqualizedSweepRequest run_equalized_sweep_request = 66;
    RunEqualizedSweepResponse run_equalized_sweep_response = 67;
    SetLmxOutputPowerRequest set_lmx_output_power_request = 68;
    SetLmxOutputPowerResponse set_lmx_output_power_response = 69;
  }
}
