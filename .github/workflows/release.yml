name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# A second push to main while the first is still building would race to
# recreate the "latest" release. Serialise per-ref and drop superseded runs.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go vet ./...
      - run: go test ./...

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset: rf-control-linux-amd64
          - goos: linux
            goarch: arm64
            asset: rf-control-linux-arm64
          - goos: darwin
            goarch: amd64
            asset: rf-control-darwin-amd64
          - goos: darwin
            goarch: arm64
            asset: rf-control-darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          # On a tag, GITHUB_REF_NAME is the tag (v1.2.3). On a main push it is
          # the branch name, which says nothing about the build — stamp the sha.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="latest-$(git rev-parse --short HEAD)"
          fi
          echo "building ${{ matrix.asset }} version=${VERSION}"
          go build -trimpath -ldflags "-s -w -X github.com/OcupointInc/rf-control/internal/buildinfo.Version=${VERSION}" \
            -o "dist/${{ matrix.asset }}" .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  build-gui-rhel8:
    name: build GUI RHEL 8/amd64
    needs: test
    runs-on: ubuntu-latest
    container: rockylinux:8
    steps:
      - name: Install RHEL 8 build dependencies
        timeout-minutes: 12
        run: |
          for attempt in 1 2 3; do
            if timeout 180s dnf install -y \
              --setopt=timeout=30 --setopt=retries=3 \
              git tar gzip findutils gcc gcc-c++ \
              pkgconf-pkg-config gtk3-devel webkit2gtk3-devel rpm-build; then
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            cmd/rf-control-gui/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cmd/rf-control-gui/frontend/package-lock.json

      - name: Verify frontend dependencies
        working-directory: cmd/rf-control-gui/frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm run check

      - name: Install pinned Wails CLI
        env:
          GOBIN: /usr/local/bin
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build RHEL 8 GUI
        working-directory: cmd/rf-control-gui
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="latest-$(printf '%.7s' "${GITHUB_SHA}")"
          fi
          wails build -clean -trimpath -m -tags webkit2_40 \
            -ldflags "-s -w -X github.com/OcupointInc/rf-control/internal/buildinfo.Version=${VERSION}" \
            -o rf-control-gui-linux-amd64

      - name: Package executable and RPM
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -C cmd/rf-control-gui/build/bin -czf \
            dist/rf-control-gui-rhel8-amd64.tar.gz \
            rf-control-gui-linux-amd64
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            APP_VERSION="${GITHUB_REF_NAME#v}"
          else
            APP_VERSION="0.1.0"
          fi
          RPM_TOP="${RUNNER_TEMP}/rf-control-rpmbuild"
          mkdir -p "${RPM_TOP}"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          rpmbuild -bb packaging/rhel/rf-control-gui.spec \
            --define "app_version ${APP_VERSION}" \
            --define "_topdir ${RPM_TOP}" \
            --define "_sourcedir ${GITHUB_WORKSPACE}"
          find "${RPM_TOP}/RPMS" -name '*.rpm' -exec cp {} dist/ \;

      - uses: actions/upload-artifact@v4
        with:
          name: rf-control-gui-rhel8-amd64
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  build-gui-windows:
    name: build GUI Windows/amd64
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            cmd/rf-control-gui/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cmd/rf-control-gui/frontend/package-lock.json

      - name: Verify frontend dependencies
        working-directory: cmd/rf-control-gui/frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm run check

      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build unified Windows GUI and CLI
        working-directory: cmd/rf-control-gui
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="latest-$(git rev-parse --short HEAD)"
          fi
          wails build -clean -windowsconsole -trimpath -m \
            -ldflags "-s -w -X github.com/OcupointInc/rf-control/internal/buildinfo.Version=${VERSION}" \
            -o rf-control-windows-amd64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: rf-control-windows-amd64.exe
          path: cmd/rf-control-gui/build/bin/rf-control-windows-amd64.exe
          if-no-files-found: error
          retention-days: 7

  build-gui-linux:
    name: build GUI Linux/${{ matrix.goarch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-24.04
          - goarch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            cmd/rf-control-gui/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cmd/rf-control-gui/frontend/package-lock.json

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Verify frontend dependencies
        working-directory: cmd/rf-control-gui/frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm run check

      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build unified Linux GUI and CLI
        working-directory: cmd/rf-control-gui
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="latest-$(git rev-parse --short HEAD)"
          fi
          wails build -clean -trimpath -m -platform linux/${{ matrix.goarch }} -tags webkit2_41 -ldflags "-s -w -X github.com/OcupointInc/rf-control/internal/buildinfo.Version=${VERSION}" -o rf-control-gui-linux-${{ matrix.goarch }}
          test "$(./build/bin/rf-control-gui-linux-${{ matrix.goarch }} version)" = "${VERSION}"

      - uses: actions/upload-artifact@v4
        with:
          name: rf-control-gui-linux-${{ matrix.goarch }}
          path: cmd/rf-control-gui/build/bin/rf-control-gui-linux-${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 7

  build-gui-macos:
    name: build GUI macOS/${{ matrix.goarch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: macos-15-intel
          - goarch: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            cmd/rf-control-gui/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cmd/rf-control-gui/frontend/package-lock.json

      - name: Verify frontend dependencies
        working-directory: cmd/rf-control-gui/frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm run check

      - name: Install pinned Wails CLI
        run: |
          for attempt in 1 2 3; do
            if go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0; then
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Build and package unified macOS GUI and CLI
        working-directory: cmd/rf-control-gui
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="latest-$(git rev-parse --short HEAD)"
          fi
          EXECUTABLE="rf-control"
          wails build -clean -trimpath -m -platform darwin/${{ matrix.goarch }} -ldflags "-s -w -X github.com/OcupointInc/rf-control/internal/buildinfo.Version=${VERSION}" -o "${EXECUTABLE}"
          BUNDLE="build/bin/rf-control.app"
          ACTUAL_VERSION="$("${BUNDLE}/Contents/MacOS/${EXECUTABLE}" version)"
          test "${ACTUAL_VERSION}" = "${VERSION}"
          mv "${BUNDLE}" "build/bin/Ocupoint RF Control.app"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "build/bin/Ocupoint RF Control.app" "dist/rf-control-gui-darwin-${{ matrix.goarch }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: rf-control-gui-darwin-${{ matrix.goarch }}
          path: cmd/rf-control-gui/dist/rf-control-gui-darwin-${{ matrix.goarch }}.zip
          if-no-files-found: error
          retention-days: 7

  # Every push to main republishes a single rolling "latest" prerelease, so the
  # download URL never changes. The old release AND its tag are deleted first:
  # gh will not move an existing tag, so without --cleanup-tag the `latest` tag
  # (and the source tarballs GitHub derives from it) would stay pinned to
  # whatever commit first created it.
  release-latest:
    name: publish rolling latest
    needs: [build, build-gui-rhel8, build-gui-windows, build-gui-linux, build-gui-macos]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Prepare release artifacts
        run: |
          cp firmware/whalepod.uf2 dist/whalepod.uf2
          ls -la dist/
          cd dist
          sha256sum * > SHA256SUMS

      - name: Recreate rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA_SHORT="$(git rev-parse --short HEAD)"
          # Drop the old release and its tag. --cleanup-tag only runs when the
          # release exists, so delete the ref separately too: a leftover `latest`
          # tag with no release would otherwise be silently reused by `create`,
          # leaving the source tarballs pointing at an ancient commit.
          gh release delete latest --cleanup-tag --yes || true
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" || true
          gh release create latest dist/* \
            --target "${GITHUB_SHA}" \
            --title "latest (${SHA_SHORT})" \
            --prerelease \
            --notes "Rolling build of \`main\` @ \`${GITHUB_SHA}\`.

          This release is **replaced on every push to main** — do not pin to it.
          For a stable, immutable build, push a \`v*\` tag and use that release."

  release-tag:
    name: publish tagged release
    needs: [build, build-gui-rhel8, build-gui-windows, build-gui-linux, build-gui-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Prepare release artifacts
        run: |
          cp firmware/whalepod.uf2 dist/whalepod.uf2
          ls -la dist/
          cd dist
          sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
